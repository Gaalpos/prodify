[package]
name = "prodify"
version = "1.10.0"
description = "Notes, journal, tasks, projects and habits, stored as Markdown"
edition = "2021"

[lib]
name = "prodify_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
# App storage (Settings → Data and backups): SQLite built in, so nothing extra is needed on any platform.
rusqlite = { version = "0.32", features = ["bundled"] }
